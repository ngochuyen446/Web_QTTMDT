<script>
(function () {
    const favicon = "./images/imagesreloom-logo.ico?v=2";

    function setFavicon() {
        const icons = document.head.querySelectorAll(
            'link[rel*="icon"]:not([data-reloom-favicon])'
        );

        icons.forEach(icon => icon.remove());

        let icon = document.head.querySelector(
            'link[data-reloom-favicon]'
        );

        if (!icon) {
            icon = document.createElement("link");
            icon.setAttribute("data-reloom-favicon", "true");
            icon.rel = "icon";
            icon.type = "image/x-icon";
            document.head.appendChild(icon);
        }

        const faviconUrl = new URL(favicon, document.baseURI).href;

        if (icon.href !== faviconUrl) {
            icon.href = faviconUrl;
        }
    }

    setFavicon();

    new MutationObserver(setFavicon).observe(document.head, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ["href", "rel"]
    });
})();
</script>
